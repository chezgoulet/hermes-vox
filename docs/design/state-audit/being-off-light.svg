<svg xmlns="http://www.w3.org/2000/svg" width="840" height="840" viewBox="0 0 840 840">
  <rect width="840" height="840" fill="#FFFFFF"/>
  <text x="36" y="52" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Being off · light theme · sound off</text>
  <text x="36" y="80" font-family="DejaVu Sans, sans-serif" font-size="13.5" fill="#444C5C">The app has no switch that stops drawing the being. "Being off" here means the phone is pocketed, the screen is dark,</text>
  <text x="36" y="99" font-family="DejaVu Sans, sans-serif" font-size="13.5" fill="#444C5C">or the caller is not looking. What is left is the state pill, the transcript (layout_mode=conversation), and TalkBack.</text>

  <!-- ============ panel A: a tool is running ============ -->
  <g>
    <rect x="36" y="128" width="360" height="600" rx="26" fill="#F3F5F9" stroke="#D2D9E7" stroke-width="2"/>
    <text x="216" y="168" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" letter-spacing="2" text-anchor="middle" fill="#0F172A">HERMES VOX</text>
    <rect x="66" y="182" width="300" height="44" rx="15" fill="#EAEFF7" stroke="#D2D9E7"/>
    <text x="216" y="201" font-family="DejaVu Sans Mono, monospace" font-size="11" text-anchor="middle" fill="#0092AE">SEARCHING THE WEB ·</text>
    <text x="216" y="217" font-family="DejaVu Sans Mono, monospace" font-size="11" text-anchor="middle" fill="#0092AE">TRAIL CONDITIONS</text>
    <rect x="66" y="242" width="300" height="172" rx="12" fill="none" stroke="#C9D2E2" stroke-dasharray="5 5"/>
    <text x="216" y="318" font-family="DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" fill="#8A97AC">the being is not visible</text>
    <text x="216" y="336" font-family="DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" fill="#8A97AC">(no in-app switch turns it off)</text>
    <text x="76" y="456" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#0F172A">You: check trail conditions near the</text>
    <text x="76" y="474" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#0F172A">     pass, and if it is clear put a hold</text>
    <text x="76" y="492" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#0F172A">     on Saturday morning</text>
    <text x="76" y="528" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#5A6B85">Agent: …</text>
    <text x="76" y="566" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-style="italic" fill="#8A97AC">Transcript holds what was said,</text>
    <text x="76" y="583" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-style="italic" fill="#8A97AC">never state narration.</text>
    <circle cx="106" cy="688" r="21" fill="none" stroke="#D2D9E7"/>
    <text x="106" y="693" font-family="DejaVu Sans, sans-serif" font-size="10" text-anchor="middle" fill="#5A6B85">set</text>
    <circle cx="216" cy="688" r="21" fill="none" stroke="#D2D9E7"/>
    <text x="216" y="693" font-family="DejaVu Sans, sans-serif" font-size="10" text-anchor="middle" fill="#35D07F">call</text>
    <circle cx="326" cy="688" r="21" fill="none" stroke="#D2D9E7"/>
    <text x="326" y="694" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" fill="#0F172A">/</text>
  </g>
  <text x="36" y="758" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">A step is running.</text>
  <text x="36" y="777" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#444C5C">Named once, in the pill (MainActivity.showOperation → setStatus):</text>
  <text x="36" y="794" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#444C5C">one line, replaced in place. The being adds nothing.</text>

  <!-- ============ panel B: the turn failed ============ -->
  <g>
    <rect x="444" y="128" width="360" height="600" rx="26" fill="#F3F5F9" stroke="#D2D9E7" stroke-width="2"/>
    <text x="624" y="168" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" letter-spacing="2" text-anchor="middle" fill="#0F172A">HERMES VOX</text>
    <rect x="456" y="182" width="336" height="56" rx="15" fill="#EAEFF7" stroke="#D2D9E7"/>
    <text x="624" y="201" font-family="DejaVu Sans Mono, monospace" font-size="10.5" text-anchor="middle" fill="#0092AE">HERMES: THE VOICE STREAM</text>
    <text x="624" y="216" font-family="DejaVu Sans Mono, monospace" font-size="10.5" text-anchor="middle" fill="#0092AE">WAS LOST · TAP TO RECONNECT</text>
    <text x="624" y="231" font-family="DejaVu Sans Mono, monospace" font-size="9.5" text-anchor="middle" fill="#5A6B85">(the whole line is the tap target)</text>
    <rect x="474" y="252" width="300" height="162" rx="12" fill="none" stroke="#C9D2E2" stroke-dasharray="5 5"/>
    <text x="624" y="326" font-family="DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" fill="#8A97AC">the being is not visible</text>
    <text x="624" y="344" font-family="DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" fill="#8A97AC">(and failure has no being state anyway)</text>
    <text x="484" y="456" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#0F172A">You: check trail conditions near the</text>
    <text x="484" y="474" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#0F172A">     pass, and if it is clear put a hold</text>
    <text x="484" y="492" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#0F172A">     on Saturday morning</text>
    <text x="484" y="528" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#5A6B85">Agent: —</text>
    <text x="484" y="566" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-style="italic" fill="#8A97AC">No reply landed, so the transcript</text>
    <text x="484" y="583" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-style="italic" fill="#8A97AC">says nothing. The failure is the pill.</text>
    <rect x="456" y="600" width="336" height="62" rx="8" fill="#FFFFFF" stroke="#E3B7B7"/>
    <text x="466" y="619" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="bold" fill="#A33A3A">Next state (onState "listening"/"idle"):</text>
    <text x="466" y="635" font-family="DejaVu Sans Mono, monospace" font-size="10.5" fill="#A33A3A">line = opHeld ?: words</text>
    <text x="466" y="651" font-family="DejaVu Sans Mono, monospace" font-size="10.5" fill="#A33A3A">show = warming || callLive || thinking</text>
    <circle cx="514" cy="688" r="21" fill="none" stroke="#D2D9E7"/>
    <text x="514" y="693" font-family="DejaVu Sans, sans-serif" font-size="10" text-anchor="middle" fill="#5A6B85">set</text>
    <circle cx="624" cy="688" r="21" fill="none" stroke="#D2D9E7"/>
    <text x="624" y="693" font-family="DejaVu Sans, sans-serif" font-size="10" text-anchor="middle" fill="#35D07F">call</text>
    <circle cx="734" cy="688" r="21" fill="none" stroke="#D2D9E7"/>
    <text x="734" y="694" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" fill="#0F172A">/</text>
  </g>
  <text x="444" y="758" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold" fill="#0F172A">A turn failed.</text>
  <text x="444" y="777" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#444C5C">MainActivity.onError → Discovery.errorLine → setStatus.</text>
  <text x="444" y="794" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#444C5C">No notification, no being state, no lasting record.</text>
</svg>
