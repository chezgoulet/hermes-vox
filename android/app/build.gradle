apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'


android {
    compileSdk 34
    defaultConfig {
        applicationId "com.hermesvox"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "0.1.0"

        // Inject the Hermes gateway API key at BUILD time from the environment
        // (secret-safe — never committed). Empty -> the entity connector errors
        // rather than faking a reply.
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    namespace 'com.hermesvox'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation fileTree(include: ['*.aar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
