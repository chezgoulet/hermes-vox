apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'


android {
    compileSdk 34
    defaultConfig {
        applicationId "com.hermesvox"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 47
        versionName "0.3.17"

        // Inject the Hermes gateway API key at BUILD time from the environment
        // (secret-safe — never committed). Empty -> the entity connector errors
        // rather than faking a reply.
    }
    signingConfigs {
        release {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "hermes-vox-${variant.versionName}.apk"
        }
    }
    namespace 'com.hermesvox'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation fileTree(include: ['*.aar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation('com.google.ai.edge.litertlm:litertlm-android:0.16.1') { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-reflect' }
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    testImplementation 'junit:junit:4.13.2'
}
