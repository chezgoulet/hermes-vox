apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release signing: load the gitignored keystore/keystore.properties (storeFile /
// storePassword / keyAlias / keyPassword). Secrets live in that gitignored file or
// the env store — NEVER in this repo. A missing file fails loudly (with a clear
// message) so we never silently fall back to the public debug key.
// Gradle root is android/; the keystore dir sits one level up at the REPO root, so
// resolve explicitly against repoRoot = rootProject.projectDir.parentFile (hermes-vox/).
def repoRoot = rootProject.projectDir.parentFile
def keystoreProps = new Properties()
def keystorePropFile = new File(repoRoot, "keystore/keystore.properties")
if (keystorePropFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropFile))
}

android {
    compileSdk 34
    // Reproducible artifacts (#166): do not embed a dependency-info blob or VCS
    // metadata in the APK/bundle. Both carry build-environment data that is not
    // part of the source.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    defaultConfig {
        applicationId "com.hermesvox"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 145
        versionName "0.9.0.2"
        // Instrumented tests are the on-device measurement path (docs/PRESENCE-BENCH.md):
        // they need a device, so gate.sh never runs them, and they never ship in an APK.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // C0 (0.4.0): no gateway key is injected or baked here. The Hermes gateway
        // API key is USER-ENTERED in the app (onboarding + Settings → Entity,
        // SecureStore-encrypted). The release guard below fails the build if a
        // build-time key injection is ever re-added.
    }
    signingConfigs {
        release {
            def kp = keystoreProps
            storeFile new File(repoRoot, kp.getProperty("storeFile", "keystore/release.keystore"))
            storePassword kp.getProperty("storePassword")
            keyAlias kp.getProperty("keyAlias", "hermes-vox")
            keyPassword kp.getProperty("keyPassword")
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            // Reproducible artifacts (#166): no VCS metadata in the release APK.
            vcsInfo {
                include = false
            }
            // scripts/repro-check.sh builds an UNSIGNED release APK by passing
            // -Phermesvox.unsigned. Normal release/nightly builds never set it,
            // so a missing keystore still fails loudly instead of silently
            // producing an unsigned artifact.
            if (!project.hasProperty('hermesvox.unsigned')) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "hermes-vox-${variant.versionName}.apk"
        }
    }
    namespace 'com.hermesvox'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
}

// Reproducible artifacts (#166): no baseline/ART profile generation. This app
// does not apply androidx.baselineprofile and ships no baseline-prof.txt; this
// rule also neutralises a profile task if a future plugin adds one. Profiles
// carry timestamps/tool versions and are not part of the source.
tasks.configureEach { task ->
    def n = task.name.toLowerCase(Locale.ROOT)
    if (n.contains('baselineprofile') || n.contains('artprofile')) {
        task.enabled = false
    }
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.26.2'
    // Only the pinned sherpa-onnx runtime (scripts/fetch-runtime.sh). Named rather than
    // '*.aar' so a stale mobile.aar from a pre-#126 checkout can never be packaged.
    implementation fileTree(include: ['sherpa-onnx-*.aar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.21'
    implementation('com.google.ai.edge.litertlm:litertlm-android:0.16.1') { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-reflect' }
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    testImplementation 'junit:junit:4.13.2'
    // Presence bench (docs/PRESENCE-BENCH.md): on-device only, instrumented.
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}

// ---------------------------------------------------------------------------
// C0 build guard (0.4.0 security): Hermes Vox never ships with a gateway key.
// The gateway API key is USER-ENTERED in the app — onboarding + Settings re-entry,
// stored via SecureStore — and must never be baked in at build time. A RELEASE
// build FAILS if either regression shows up, so a baked key can never ship again:
//   (a) the old build-time env source HERMES_VOX_API_KEY is set in this shell, or
//   (b) a buildConfigField key injection is re-added to the module gradle sources
//       (any field whose name mentions a key / an API key).
// Debug + unit-test builds are untouched, so day-to-day dev and the
// :app:testDebugUnitTest gate keep working.
// ---------------------------------------------------------------------------
gradle.taskGraph.whenReady { graph ->
    boolean releaseRequested = graph.hasTask(':app:assembleRelease') || graph.hasTask(':app:bundleRelease')
    if (!releaseRequested) return

    // (a) the legacy env injection source is present -> fail the release build.
    String envKey = System.getenv('HERMES_VOX_API_KEY')
    if (envKey != null && !envKey.trim().isEmpty()) {
        throw new GradleException(
            "C0 build guard FAILED: HERMES_VOX_API_KEY is set in this environment. " +
            'Hermes Vox never ships with a key - you enter your own. The gateway ' +
            "API key is user-entered in the app (onboarding + Settings), never " +
            "baked at build time. Unset HERMES_VOX_API_KEY and rebuild the release.")
    }

    // (b) a key field was re-added to the gradle sources -> fail the release build.
    boolean keyInjectionReadded = false
    project.fileTree(project.projectDir) { include '**/*.gradle'; exclude '**/build/**', '**/.gradle/**' }.each { f ->
        f.eachLine('UTF-8') { line ->
            boolean isInjection = (line =~ /^\s*buildConfigField\b/) || (line =~ /buildConfigField\s+"/)
            if (isInjection && (line =~ /(?i)key/)) keyInjectionReadded = true
        }
    }
    if (keyInjectionReadded) {
        throw new GradleException(
            "C0 build guard FAILED: a buildConfigField key injection was re-added " +
            "to the module gradle sources. Hermes Vox never ships with a key - you " +
            "enter your own. Remove the injection; the gateway API key is " +
            "user-entered in the app (onboarding + Settings).")
    }
}
