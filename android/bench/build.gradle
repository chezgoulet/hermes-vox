apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// On-device A/B harness for streaming STT (docs/STT-AB.md).
//
// A SEPARATE applicationId (com.hermesvox.bench) on purpose: measuring must not
// replace or restart the copy of Hermes Vox the user (or another agent) is using
// on the shared Pixel. It links the same pinned sherpa-onnx AAR the app ships
// (../app/libs, fetched by scripts/fetch-runtime.sh), so the numbers describe the
// runtime that would actually ship.
// #165: the staged from-source runtime, or null for the prebuilt AAR (the default build).
// The bench measures the runtime that ships, so it follows the same switch the app follows.
def sherpaSource = project.findProperty('hermesvox.sherpaSource')?.with { file(it) }
if (sherpaSource != null) {
    if (!new File(sherpaSource, 'jniLibs').isDirectory() || !new File(sherpaSource, 'kotlin').isDirectory())
        throw new GradleException("hermesvox.sherpaSource=$sherpaSource has no jniLibs/ + kotlin/ — run scripts/build-sherpa-from-source.sh")
}

android {
    namespace 'com.hermesvox.bench'
    compileSdk 34
    defaultConfig {
        applicationId "com.hermesvox.bench"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    if (sherpaSource != null) {
        sourceSets.main.jniLibs.srcDirs += new File(sherpaSource, 'jniLibs')
        sourceSets.main.java.srcDirs += new File(sherpaSource, 'kotlin')
    }
}

dependencies {
    // Same runtime the app packages: the pinned AAR by default (named, never '*.aar'), or the
    // from-source build when -Phermesvox.sherpaSource is set, with onnxruntime from Maven Central.
    if (sherpaSource != null) {
        implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.27.0'   // = ORT_VERSION
    } else {
        implementation fileTree(include: ['sherpa-onnx-*.aar'], dir: '../app/libs')
    }
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.21'
}
