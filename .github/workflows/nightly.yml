name: nightly-build

# Hermes Vox NIGHTLY — a build per merge into `testing`.
#
# The git flow (2026-09-08):
#   main     — deployable/buildable always; releases are cut FROM main ONLY.
#   testing  — integration branch; features branch off testing and merge INTO
#              testing. Every push/merge to testing produces a NIGHTLY artifact:
#              a prerelease tagged nightly-YYYYMMDD-HHMMSS with the APK attached,
#              publicly installable via Obtainium (prerelease, not a tracked
#              release — it never becomes "Latest").
# Releases (testing → main) are still cut by hand per docs/RELEASE-PROCESS.md —
# this workflow does NOT cut release tags.

on:
  push:
    branches: [testing]

permissions:
  contents: write

concurrency:
  group: nightly-testing
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The release keystore is repository-encrypted (age, key = repo secret).
      # Nightlies are signed with the SAME release key AND carry a versionCode at or
      # above the release's (see the pre-merge bump in docs/RELEASE-PROCESS.md), so an
      # Obtainium nightly can be installed over / alongside a release without an
      # uninstall. Same key alone is not enough — a lower versionCode is a downgrade and
      # Android refuses it.
      - name: Install age
        run: |
          curl -fsSL -o /tmp/age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          tar -xzf /tmp/age.tar.gz -C /tmp
          sudo mv /tmp/age/age /usr/local/bin/age

      - name: Restore keystore + the sherpa AAR (age-decrypt from repo, key = secret)
        env:
          KEYSTORE_AGE_KEY: ${{ secrets.KEYSTORE_AGE_KEY }}
        run: |
          mkdir -p keystore android/app/libs
          printf '%s' "$KEYSTORE_AGE_KEY" > /tmp/nightly.key
          age -d -i /tmp/nightly.key keystore/release.keystore.age > keystore/release.keystore
          age -d -i /tmp/nightly.key keystore/keystore.properties.age > keystore/keystore.properties
          age -d -i /tmp/nightly.key libs/sherpa-onnx-1.13.6.aar.age > android/app/libs/sherpa-onnx-1.13.6.aar
          rm -f /tmp/nightly.key
          echo "keystore: $(wc -c < keystore/release.keystore) bytes; sherpa AAR: $(wc -c < android/app/libs/sherpa-onnx-1.13.6.aar) bytes"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/app/build.gradle') }}
          restore-keys: gradle-

      # A nightly and a release can carry the SAME versionCode (they do right now: 144),
      # so without this the phone cannot tell you which build it is actually running.
      # The label changes and nothing else: versionCode is untouched, which is what
      # installability depends on.
      - name: Stamp the build identity
        run: |
          SHORT=$(git rev-parse --short HEAD)
          VERSION=$(grep -m1 'versionName' android/app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          case "$VERSION" in *-nightly-*) echo "already stamped: $VERSION"; exit 1 ;; esac
          sed -i "s/versionName \"$VERSION\"/versionName \"$VERSION-nightly-$SHORT\"/" android/app/build.gradle
          grep -q "versionName \"$VERSION-nightly-$SHORT\"" android/app/build.gradle
          echo "nightly label: $VERSION-nightly-$SHORT (versionCode untouched: $(grep -m1 versionCode android/app/build.gradle | awk '{print $2}'))"

      - name: Build release APK + unit tests
        working-directory: android
        run: ./gradlew --no-daemon -q assembleRelease testReleaseUnitTest

      - name: Test roll-up (fail the build on any failure)
        working-directory: android
        run: |
          python3 - << 'EOF'
          import glob, xml.etree.ElementTree as ET, sys
          t=f=e=0
          for p in glob.glob("app/build/test-results/testReleaseUnitTest/*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests",0)); f += int(r.get("failures",0)); e += int(r.get("errors",0))
          print(f"tests={t} failures={f} errors={e}")
          sys.exit(1) if (f or e) else print("GATE GREEN")
          EOF

      # #167: the same six cases, now pointed at the REAL gateway. Forks and PRs
      # have no secrets, so this step must no-op cleanly without the key (the fake
      # run above already covered the suite). HERMES_VOX_HERMES_URL must name a
      # reachable gateway; the suite's own default is http://127.0.0.1:8642.
      - name: Live gateway suite against the real gateway (optional)
        working-directory: android
        env:
          HERMES_VOX_HERMES_API_KEY: ${{ secrets.HERMES_VOX_HERMES_API_KEY }}
          # Optional repository variable; when unset the suite uses its own default.
          HERMES_VOX_HERMES_URL: ${{ vars.HERMES_VOX_HERMES_URL }}
          HERMES_VOX_LIVE: "1"
        run: |
          if [ -z "${HERMES_VOX_HERMES_API_KEY}" ]; then
            echo "no HERMES_VOX_HERMES_API_KEY secret: real-gateway live run skipped (fake run already passed above)"
            exit 0
          fi
          ./gradlew --no-daemon -q testReleaseUnitTest --tests '*LiveGatewayTest' --rerun

      - name: Name the nightly APK
        working-directory: android
        run: |
          # The stamp already carries the version and the commit, so the asset name is
          # just the version: hermes-vox-0.9.0.1-nightly-e434435.apk
          VERSION=$(grep -m1 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          VC=$(grep -m1 'versionCode' app/build.gradle | awk '{print $2}')
          SHORT=$(git rev-parse --short HEAD)
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/hermes-vox-${VERSION}.apk
          echo "APK=hermes-vox-${VERSION}.apk" >> $GITHUB_ENV
          echo "TAG=nightly-$(date -u +%Y%m%d-%H%M%S)-${SHORT}" >> $GITHUB_ENV

      - name: Create the nightly prerelease + upload the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # Must name the built commit: without it, action-gh-release tags the DEFAULT
          # branch, so a nightly built from `testing` lands its tag on `main` — a tag
          # whose name says one commit and whose ref says another.
          target_commitish: ${{ github.sha }}
          name: "Nightly ${{ env.TAG }}"
          prerelease: true
          make_latest: false          # NEVER becomes "Latest" — releases from main do
          body: |
            Automated nightly from `testing` @ ${{ github.sha }}.
            Install via Obtainium (prereleases) — NOT for the release track.
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
