name: live-gateway

# The real-gateway suite (#167), which used to ride the nightly.
#
# Why it moved
# ------------
# This suite needs a REAL `API_SERVER_KEY` for a real Hermes gateway, and the key is a
# live credential for an agent with tools — it can be *used*, not only stolen. Running it
# from a job that any push to `testing` starts meant a commit (or an agent) could drive
# that agent from CI. A signature can be argued with after the fact; a session with an
# agent cannot be un-spent.
#
# So the suite is dispatch-only, and it belongs to a throwaway gateway profile with no
# tools, no memory and no skills — not the owner's own agent. Set the two inputs below
# (or the repository variable HERMES_VOX_HERMES_URL and the secret) and run it by hand
# before a release cut. A red run here is a release blocker; a skipped run is not a pass.
#
#   gh workflow run live-gateway.yml -f url=https://<throwaway-profile-host>
#
# The unit suite with the fake gateway still runs on every push in nightly-unsigned-build
# and ci.yml, so this being manual does not weaken ordinary coverage.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Gateway base URL for the throwaway profile (blank = repository variable, then the suite default)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.4.0
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch the pinned speech runtime (verified)
        run: bash scripts/fetch-runtime.sh

      - name: Live gateway suite
        working-directory: android
        env:
          HERMES_VOX_HERMES_API_KEY: ${{ secrets.HERMES_VOX_HERMES_API_KEY }}
          HERMES_VOX_HERMES_URL: ${{ inputs.url || vars.HERMES_VOX_HERMES_URL }}
          HERMES_VOX_LIVE: "1"
        run: |
          set -euo pipefail
          # A missing key is a failure here, not a skip: a dispatch that asks for the live
          # suite and then quietly tests the fake one is the worst of both.
          if [ -z "${HERMES_VOX_HERMES_API_KEY:-}" ]; then
            echo "::error::HERMES_VOX_HERMES_API_KEY is not set; the live suite cannot run"
            exit 1
          fi
          ./gradlew --no-daemon -q testReleaseUnitTest --tests '*LiveGatewayTest' --rerun
