name: ci

# The pull-request gate. Every PR into `testing` or `main` (and every push to
# them) runs the Android build + unit tests (the Kotlin voice core and its
# stream parity harness included). It needs no secrets: the sherpa-onnx runtime
# comes from the public upstream release (SHA-256 pinned in scripts/fetch-runtime.sh) and the APK is a debug
# build, so it runs for forks too. Signing and publishing stay in nightly.yml.

on:
  pull_request:
    branches: [testing, main]
  push:
    branches: [testing, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # tags: the versionCode check compares against shipped releases
          fetch-tags: true

      # #262 fallout: versionCode discipline must be enforced, not remembered. Nightlies
      # carry the release's code, so a branch that lags a shipped release produces
      # downgrades that cannot install over it (the 0.8.0 failure, 33786fa).
      - name: versionCode discipline
        run: bash scripts/check-version-code.sh

      # #221: the app skill must agree with the code it describes. This is the same
      # pair gate.sh runs first (presence report self-test + app skill claims); both
      # are stdlib-only, so they run before the toolchain is even set up.
      - name: Docs self-tests (presence report + app skill claims)
        run: |
          python3 scripts/test_presence_session_report.py
          python3 scripts/check-skill-claims.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch the pinned sherpa-onnx runtime (sha256-verified)
        run: bash scripts/fetch-runtime.sh
      - name: Build debug APK + unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/

      # #167: the live gateway suite must RUN here, not skip. Its six cases always
      # execute against the deterministic FakeGateway; the seventh case proves the
      # harness can fail. A skipped case, a missing result file or a short count is
      # an error, and the names land in the job summary.
      - name: Live gateway suite summary (six cases, none skipped)
        if: always()
        working-directory: android
        run: |
          python3 - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET
          path = "app/build/test-results/testDebugUnitTest/TEST-com.hermesvox.core.LiveGatewayTest.xml"
          if not os.path.isfile(path):
              print("::error::LiveGatewayTest produced no result XML: the live cases did not run")
              sys.exit(1)
          root = ET.parse(path).getroot()
          tests = int(root.get("tests", 0))
          skipped = int(root.get("skipped", 0))
          failures = int(root.get("failures", 0))
          errors = int(root.get("errors", 0))
          names = [c.get("name") for c in root.findall("testcase")]
          selfcheck = [n for n in names if n.startswith("the harness fails")]
          live = [n for n in names if n not in selfcheck]
          lines = [
              f"LiveGatewayTest: {tests} ran ({len(live)} live cases + {len(selfcheck)} self-check), "
              f"{skipped} skipped, {failures} failed, {errors} errored",
              "",
          ] + [f"- {n}" for n in live]
          if selfcheck:
              lines += ["", "Harness self-check:"] + [f"- {n}" for n in selfcheck]
          report = "\n".join(lines)
          print(report)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("### Live gateway suite\n\n" + report + "\n")
          if skipped or failures or errors:
              print("::error::the live gateway suite must pass with nothing skipped")
              sys.exit(1)
          if len(live) < 6 or not selfcheck:
              print("::error::expected the six live cases plus the harness self-check")
              sys.exit(1)
          PY

  # Reproducibility is part of the PR contract for app changes (#166): build the
  # same source twice from two different absolute paths and require byte-identical
  # unsigned release APKs. This job is slow (two clean release builds), so it is
  # gated on the diff touching the app/build inputs.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if printf '%s\n' "$changed" | grep -Eq '^(android/|scripts/(repro-check|fetch-runtime)\.sh$|libs/)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  repro:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build twice from two paths and compare unsigned release APKs
        run: bash scripts/repro-check.sh
      - name: Upload the two APKs' hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-hashes
          path: /tmp/opencode/vox-repro/hashes.txt
          if-no-files-found: warn
