name: ci

# The pull-request gate. Every PR into `testing` or `main` (and every push to
# them) runs the Android build + unit tests (the Kotlin voice core and its
# stream parity harness included). It needs no secrets: the sherpa-onnx runtime
# comes from the public upstream release (SHA-256 pinned in scripts/fetch-runtime.sh) and the APK is a debug
# build, so it runs for forks too. Signing and publishing stay in nightly.yml.

on:
  pull_request:
    branches: [testing, main]
  push:
    branches: [testing, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch the pinned sherpa-onnx runtime (sha256-verified)
        run: bash scripts/fetch-runtime.sh
      - name: Build debug APK + unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/

  # Reproducibility is part of the PR contract for app changes (#166): build the
  # same source twice from two different absolute paths and require byte-identical
  # unsigned release APKs. This job is slow (two clean release builds), so it is
  # gated on the diff touching the app/build inputs.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if printf '%s\n' "$changed" | grep -Eq '^(android/|scripts/(repro-check|fetch-runtime)\.sh$|libs/)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  repro:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build twice from two paths and compare unsigned release APKs
        run: bash scripts/repro-check.sh
      - name: Upload the two APKs' hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-hashes
          path: /tmp/opencode/vox-repro/hashes.txt
          if-no-files-found: warn
